name: ci

on:
  pull_request:
    paths:
      - "back/**"
  push:
    branches: ["main"]
    paths:
      - "back/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Maven verify
        run: mvn -B -ntp clean verify

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: kolok-jar
          path: back/target/*.jar
          if-no-files-found: error
